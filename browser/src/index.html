<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0" />
    <title>Gyrus</title>
    <!-- ITCSS: Settings -->
    <link rel="stylesheet" href="styles/01-settings/_colors.css" />
    <link rel="stylesheet" href="styles/01-settings/_typography.css" />
    <link rel="stylesheet" href="styles/01-settings/_spacing.css" />
    <link rel="stylesheet" href="styles/01-settings/_transitions.css" />
    <!-- ITCSS: Elements -->
    <link rel="stylesheet" href="styles/04-elements/_base.css" />
    <!-- ITCSS: Objects -->
    <link rel="stylesheet" href="styles/05-objects/_layout.css" />
    <!-- ITCSS: Components -->
    <link rel="stylesheet" href="styles/06-components/_controls.css" />
    <link rel="stylesheet" href="styles/06-components/_rail.css" />
    <link rel="stylesheet" href="styles/06-components/_url-bar.css" />
    <link rel="stylesheet" href="styles/06-components/_window-controls.css" />
    <link rel="stylesheet" href="styles/06-components/_start.css" />
    <link rel="stylesheet" href="styles/06-components/_run.css" />
    <link rel="stylesheet" href="styles/06-components/_task.css" />
    <link rel="stylesheet" href="styles/06-components/_webview.css" />
    <link rel="stylesheet" href="styles/06-components/_network-modal.css" />
    <link rel="stylesheet" href="styles/06-components/_about-panel.css" />
    <!-- ITCSS: Platforms -->
    <link rel="stylesheet" href="styles/07-platforms/_macos.css" />
    <link rel="stylesheet" href="styles/07-platforms/_windows.css" />
  </head>
  <body data-view="start">
    <div class="app">
      <!-- Left rail: New search, Tasks (General + one per task), Memory, About -->
      <div id="rail-container" class="app__rail"></div>

      <div class="app__main">
        <!-- Top bar: back / forward / address while a page is open; window buttons in Electron -->
        <header class="topbar">
          <div id="nav-controls-container" class="topbar__nav"></div>
          <div id="url-bar-container" class="topbar__address"></div>
          <div id="window-controls-container" class="topbar__window"></div>
        </header>

        <main class="stage">
          <!-- Start screen (empty state) -->
          <section class="view view--start" id="start-container" aria-label="New search"></section>

          <!-- A search happening: the intent guess and the crew at work (app.js renderRun) -->
          <section class="view view--run" id="run-view" aria-live="polite" hidden></section>

          <!-- A task: its intent, what the crew did, and the reading list (app.js renderTaskView) -->
          <section class="view view--task" id="task-view" hidden></section>

          <!-- One open page, with a way back to the list it came from -->
          <section class="view view--page" id="webview-container" aria-label="Page"></section>
        </main>
      </div>
    </div>

    <!-- Memory graph -->
    <div id="network-modal-container"></div>

    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- JavaScript -->
    <script src="js/platform.js"></script>
    <script src="js/demo-seed.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
    <script src="js/easter-eggs.js"></script>
  </body>
</html>
